<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacePilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    .ca-lang-switch { display: inline-flex; gap: 0; margin-left: 8px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .ca-lang-btn { background: transparent; border: none; padding: 3px 8px; cursor: pointer; font-size: 11px; font-family: inherit; color: var(--ink-mid); font-weight: 500; letter-spacing: 0.05em; }
    .ca-lang-btn.active { background: var(--ink); color: var(--bg); }
    .ca-lang-btn:not(.active):hover { background: var(--border); }
  </style>
</head>
<body>

  <!-- ══════ Auth page (OTP magic code) ══════ -->
  <div id="auth-page" class="ca-auth-page" style="display:none;">
    <div class="ca-auth-card">
      <div class="ca-auth-logo">Pace<em>Pilot</em> <img src="/img/compatible_strava.svg" alt="Compatible with Strava" class="ca-strava-badge"></div>
      <p class="ca-auth-subtitle" data-i18n="auth.subtitle">Ton copilote de course</p>

      <!-- Step 1: Email -->
      <form id="otp-email-form" class="ca-auth-form">
        <input type="email" id="otp-email" class="ca-input" placeholder="Email" data-i18n-placeholder="auth.emailPlaceholder" required autocomplete="email">
        <div id="otp-email-error" class="ca-auth-error" style="display:none;"></div>
        <button type="submit" class="ca-btn accent ca-auth-btn" data-i18n="auth.sendCode">Recevoir un code</button>
      </form>

      <!-- Step 2: Code -->
      <form id="otp-code-form" class="ca-auth-form" style="display:none;">
        <p class="ca-auth-hint"><span data-i18n="auth.codeSent">Un code a été envoyé à</span> <strong id="otp-email-display"></strong></p>
        <input type="text" id="otp-code" class="ca-input ca-otp-input" placeholder="Code à 6 chiffres" data-i18n-placeholder="auth.codePlaceholder" required autocomplete="one-time-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}">
        <div id="otp-code-error" class="ca-auth-error" style="display:none;"></div>
        <button type="submit" class="ca-btn accent ca-auth-btn" data-i18n="auth.verify">Valider</button>
        <div class="ca-auth-toggle">
          <span id="otp-back" class="ca-auth-link" data-i18n="auth.changeEmail">Changer d'email</span>
          <span id="otp-resend" class="ca-auth-link" data-i18n="auth.resendCode">Renvoyer le code</span>
        </div>
      </form>
    </div>
  </div>

  <!-- ══════ App (hidden until authenticated) ══════ -->
  <div id="app-shell" style="display:none;">

    <!-- Header -->
    <header class="ca-header">
      <div class="ca-header-inner">
        <div class="ca-header-title">Pace<em>Pilot</em> <img src="/img/compatible_strava.svg" alt="Compatible with Strava" class="ca-strava-badge-header"></div>
        <div class="ca-header-meta">
          <span id="header-user"></span>
          <span id="header-date">—</span>
          <span id="header-count">—</span>
          <span id="header-sync" class="ca-sync-indicator">—</span>
          <button id="sync-btn" class="ca-sync-btn" data-i18n-title="header.sync" title="Synchroniser">↻</button>
          <button id="logout-btn" class="ca-sync-btn" data-i18n-title="header.logout" title="Déconnexion">⏻</button>
          <span class="ca-lang-switch">
            <button class="ca-lang-btn" data-lang="fr">FR</button>
            <button class="ca-lang-btn" data-lang="en">EN</button>
          </span>
        </div>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="ca-nav">
      <button class="ca-nav-tab active" data-section="overview" data-i18n="nav.overview">Vue d'ensemble</button>
      <button class="ca-nav-tab" data-section="history" data-i18n="nav.history">Historique</button>
      <button class="ca-nav-tab" data-section="profil" data-i18n="nav.profil">Profil</button>
      <button class="ca-nav-tab" data-section="progression" data-i18n="nav.progression">Progression</button>
      <button class="ca-nav-tab" data-section="explication" data-i18n="nav.explication">Explication</button>
      <button class="ca-nav-tab" data-section="calendrier" data-i18n="nav.calendrier">Calendrier</button>
      <button class="ca-nav-tab" data-section="analyse" data-i18n="nav.analyse">Analyse</button>
      <button class="ca-nav-tab" data-section="stadiums" data-i18n="nav.stadiums">Mes stades</button>
      <button class="ca-nav-tab" data-section="settings" data-i18n="nav.settings">Paramètres</button>
      <div class="ca-sport-selector">
        <button class="ca-sport-btn active" data-sport="run" data-i18n-title="nav.runTitle" data-i18n="nav.run" title="Course à pied">Run</button>
        <button class="ca-sport-btn" data-sport="velo" data-i18n-title="nav.bikeTitle" data-i18n="nav.bike" title="Vélo">Vélo</button>
      </div>
    </nav>

    <!-- Contenu principal -->
    <main id="page-content" class="ca-main">
      <div class="ca-loading" data-i18n="common.loading">Chargement…</div>
    </main>

    <!-- Navigation basse (mobile uniquement — .ca-nav prend le relais dès 769px).
         Les data-section reprennent les mêmes clés que la nav du haut : navigate()
         synchronise les deux barres. -->
    <nav class="ca-bottom-nav" aria-label="Navigation principale">
      <button class="ca-bnav-tab active" data-section="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M9.5 19V5M15 19V14M20.5 19V8"/></svg>
        <span data-i18n="nav.shortOverview">Résumé</span>
      </button>
      <button class="ca-bnav-tab" data-section="calendrier">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span data-i18n="nav.shortCalendrier">Agenda</span>
      </button>
      <button class="ca-bnav-tab" data-section="analyse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h3.5l2.5-7 3 13 2.5-9 2 3H21"/></svg>
        <span data-i18n="nav.shortAnalyse">Analyse</span>
      </button>
      <button class="ca-bnav-tab" data-section="stadiums">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="5.5"/><rect x="7" y="10" width="10" height="4" rx="2"/></svg>
        <span data-i18n="nav.shortStadiums">Stades</span>
      </button>
      <button class="ca-bnav-tab ca-bnav-more" id="more-btn" aria-expanded="false" aria-controls="more-sheet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg>
        <span data-i18n="nav.more">Plus</span>
      </button>
    </nav>

    <!-- Feuille « Plus » : sections secondaires + réglages déplacés du header -->
    <div id="more-sheet-backdrop" class="ca-sheet-backdrop" hidden></div>
    <div id="more-sheet" class="ca-sheet" role="dialog" aria-modal="true" aria-labelledby="more-sheet-title" hidden>
      <div class="ca-sheet-handle" aria-hidden="true"></div>
      <!-- app.js y déplace nom, date, nombre d'activités et fraîcheur de synchro
           sous 768px : le header mobile ne garde que le logo et les deux boutons. -->
      <div class="ca-sheet-meta" id="sheet-meta"></div>
      <div class="ca-sheet-title" id="more-sheet-title" data-i18n="nav.moreTitle">Autres rubriques</div>
      <div class="ca-sheet-links">
        <button class="ca-bnav-tab ca-sheet-link" data-section="history" data-i18n="nav.history">Historique</button>
        <button class="ca-bnav-tab ca-sheet-link" data-section="profil" data-i18n="nav.profil">Profil</button>
        <button class="ca-bnav-tab ca-sheet-link" data-section="progression" data-i18n="nav.progression">Progression</button>
        <button class="ca-bnav-tab ca-sheet-link" data-section="explication" data-i18n="nav.explication">Métriques</button>
        <button class="ca-bnav-tab ca-sheet-link" data-section="settings" data-i18n="nav.settings">Paramètres</button>
      </div>
      <!-- app.js y déplace le sélecteur Run/Vélo et le switch FR/EN sous 768px,
           et les remet dans le header au-dessus. Un seul exemplaire de chaque :
           pas d'ID dupliqué, pas de listener à recâbler. -->
      <div class="ca-sheet-controls" id="sheet-controls"></div>
    </div>

  </div>

  <!-- ══════ Modal: Strava onboarding (première connexion) ══════ -->
  <div id="strava-onboarding-modal" class="ca-modal-overlay" style="display:none;">
    <div class="ca-modal-card">
      <div class="ca-modal-title" data-i18n="onboarding.welcome">Bienvenue sur PacePilot !</div>
      <p class="ca-modal-text" data-i18n="onboarding.stravaIntro">
        Pour commencer, connecte ton compte <strong>Strava</strong> afin de synchroniser automatiquement tes activités.
      </p>
      <img
        id="strava-onboarding-connect"
        src="/img/btn_strava_connect.png"
        alt="Connect with Strava"
        class="ca-modal-strava-btn"
      >
      <button id="strava-onboarding-skip" class="ca-modal-skip" data-i18n="onboarding.later">Plus tard</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
  <script type="module" src="js/app.js?v=7"></script>

</body>
</html>
